<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <title>Color test</title>

    <script src="eel.js"></script>
    <link rel="icon" type="image/jpg" href="/favicon.jpg">

    <link rel="stylesheet" href="Color_test.css">
    <link href="https://fonts.googleeapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">


    <script type="text/javascript" src="/eel.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript">
        async function match(){
            eel.color_match()();
            get_word();
        }

        async function dismatch(){
            eel.color_dismatch()();
            get_word();
        }

        async function finish(){
            eel.finish_Color_test()();
            window.location.href = 'Color_test_results.html';
        }

        async function get_word(){
            let word = await eel.get_word()();
            document.getElementById("work_text").innerHTML = word;
            return 0;
        }


        get_word();

        document.addEventListener("keydown", function (event) {
            if (event.code == 'Escape'){
                dismatch();
            }
            if (event.code == 'Enter'){
                match();
            }
        });
    </script>

    <script type="text/javascript" id="timer_js">
        function formatTimeLeft(time) {
            const minutes = Math.floor(time / 60);
            let seconds = time % 60;
            if (seconds < 10) {
                seconds = `0${seconds}`;
            }

            return `${minutes}:${seconds}`;
        }


        var timeleft = {timeleft};
        var downloadTimer = setInterval(function(){
            if (timeleft != 100000000000){
            if(timeleft <= 0){
                clearInterval(downloadTimer);
                finish();
            } else {
                document.getElementById("timer").innerHTML = formatTimeLeft(timeleft);
            }
                timeleft -= 1;
                }else {
                    document.getElementById("timer").innerHTML = "+INF";
                }
            }, 1000);
        </script>
</head>
<body>
    <div id="header">
        <a href="../Cover.html" id="header_button"> Exit </a>
        <span id='header_text'> Color test </span>
        <span id="timer">
        </span>
    </div>
    <div align="center" id="main">
    <div id="work_text">
    </div>
    </div>
    <div id="buttons">
        <button class="dismatch" onclick="match()">Dismatch</button>
        <button class="match" onclick="dismatch()">Match</button>
        </span>
    </div>
</body>
</html>
