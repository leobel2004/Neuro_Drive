<!DOCTYPE html>
<html lang="en">
<head>

    <script type="text/javascript" src="/eel.js"></script>
    <script type="text/javascript">
        document.addEventListener("keydown", function (event) {
            if (event.code == 'Escape'){
                window.location.href = '../Cover.html';
            }
            if (event.code == 'Enter'){
                get_info();
            }
        });


        async function get_info(){
            var time = document.getElementById('time').value;
            const size = document.querySelector('input[name="size"]:checked').value;
            var a = document.getElementById('stimul1').value;
            var b = document.getElementById('stimul2').value;
            var c = document.getElementById('stimul3').value;
            var d = document.getElementById('stimul4').value;
            var e = document.getElementById('stimul5').value;
            var f = document.getElementById('stimul6').value;
            eel.get_rt_time(size, time, a, b, c, d, e, f)();
            window.location.href = 'Reaction_test_settings' + size + '.html';
        }

        function change_num(num){
            let i = 1;
            while (i < 7) {
            var el = '.№' + i;
            if (i <= num){
            $(el).css('display', 'inline');}
            else{
            $(el).css('display', 'none');
            }
            i++;
            }
        }


        jQuery(function($) {
        $('#stimul1').on('input', function() {
            var n = 100 - document.getElementById('stimul1').value;
            var changed_sum = document.getElementById('stimul1').value;
            var i = 2;
            const size = document.querySelector('input[name="size"]:checked').value;
            while (i <= size){
                var s = 'stimul' + i;
                document.getElementById(s).value = n / (size - i + 1);
                n -= document.getElementById(s).value;
                i += 1;
            }
            while (i <= 6){
                var s = 'stimul' + i;
                document.getElementById(s).value = 0;
                i += 1;
            }
        });

        $('#stimul2').on('input', function() {
            var n = 100 - document.getElementById('stimul1').value - document.getElementById('stimul2').value;
            var i = 3;
            const size = document.querySelector('input[name="size"]:checked').value;
            while (i <= size){
                var s = 'stimul' + i;
                document.getElementById(s).value = n / (size - i + 1);
                n -= document.getElementById(s).value;
                i += 1;
            }
            while (i <= 6){
                var s = 'stimul' + i;
                document.getElementById(s).value = 0;
                i += 1;
            }
        });

        $('#stimul3').on('input', function() {
            var n = 100 - document.getElementById('stimul1').value - document.getElementById('stimul2').value - document.getElementById('stimul3').value;
            var i = 4;
            const size = document.querySelector('input[name="size"]:checked').value;
            while (i <= size){
                var s = 'stimul' + i;
                document.getElementById(s).value = n / (size - i + 1);
                n -= document.getElementById(s).value;
                i += 1;
            }
            while (i <= 6){
                var s = 'stimul' + i;
                document.getElementById(s).value = 0;
                i += 1;
            }
        });

        $('#stimul4').on('input', function() {
            var n = 100 - document.getElementById('stimul1').value - document.getElementById('stimul2').value - document.getElementById('stimul3').value - document.getElementById('stimul4').value;
            var i = 5;
            const size = document.querySelector('input[name="size"]:checked').value;
            while (i <= size){
                var s = 'stimul' + i;
                document.getElementById(s).value = n / (size - i + 1);
                n -= document.getElementById(s).value;
                i += 1;
            }
            while (i <= 6){
                var s = 'stimul' + i;
                document.getElementById(s).value = 0;
                i += 1;
            }
        });

        $('#stimul5').on('input', function() {
            var n = 100 - document.getElementById('stimul1').value - document.getElementById('stimul2').value - document.getElementById('stimul3').value - document.getElementById('stimul4').value -  - document.getElementById('stimul5').value;
            var i = 6;
            const size = document.querySelector('input[name="size"]:checked').value;
            while (i <= size){
                var s = 'stimul' + i;
                document.getElementById(s).value = n / (size - i + 1);
                n -= document.getElementById(s).value;
                i += 1;
            }
            while (i <= 6){
                var s = 'stimul' + i;
                document.getElementById(s).value = 0;
                i += 1;
            }
        });

        $('#stimul6').on('input', function() {
            var changed_sum = document.getElementById('stimul1').value + document.getElementById('stimul2').value + document.getElementById('stimul3').value + document.getElementById('stimul4').value + document.getElementById('stimul5').value;
            if (document.getElementById(stimul6).value + changed_sum > 100){
                document.getElementById(stimul6).value = 100 - changed_sum;
            }
        });
        });

    </script>
</head>
