<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <title>Array test</title>

        <script src="eel.js"></script>
        <link rel="icon" type="image/jpg" href="/favicon.jpg">

        <link rel="stylesheet" href="Reaction_test_settings2.css">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <link href="https://fonts.googleeapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">


    <script type="text/javascript" src="/eel.js"></script>
    <script type="text/javascript">
    var key1 = 'not';
    var key2 = 'not';
    var trigger = 0;
    $(function() {
        $('#stimul1').change(function () {
            var color = $(this).find(':selected').val();
            $("#stimul_1").css('background', color);
        });
        $('#stimul2').change(function () {
            var color = $(this).find(':selected').val();
            $("#stimul_2").css('background', color);
        });
    });

        document.addEventListener("keydown", function (event) {
            if (trigger == 1){
                key1 = event.key;
                document.getElementById("stimul_1").innerHTML = event.key;
            }
            if (trigger == 2){
                key2 = event.key;
                document.getElementById("stimul_2").innerHTML = event.key;
            }
            if (event.code == 'Escape'){
                window.location.href = '../Cover.html';
            }
        });


        async function get_info(){
            var colors = document.getElementById('stimul1').value + ' ' + document.getElementById('stimul2').value;
            var keys = key1 + ',' + key2;
            var count = 2;
            eel.Reaction_test_generate(count, colors, keys)();
            window.location.href = 'Reaction_test.html';
        }


        function handle(n) {
            trigger = n;
            $("#stimul_" + n).css('outline', '3px solid black');
            var timeleft = 3;
            var downloadTimer = setInterval(function(){
            if(timeleft <= 0){
                trigger = 0;
                $("#stimul_" + n).css('outline', 'none');
                clearInterval(downloadTimer);
            }
                timeleft -= 1;
            }, 1000);

        }

    </script>
</head>
<body align="center">
    <div id="header">
        <a href="../Cover.html" id="header_button"> Exit </a>
        <span id='header_text'> Settings </span>
        <span id="Space">
        </span>
    </div>
    <h2>Please, choose colors of stimuls:</h2>
    <div class="block">
    <button id="stimul_1" class="circle" onclick="handle(1)">  </button>

    <button id="stimul_2" class="circle" onclick="handle(2)">  </button>
    </div>
    <div class="colors">
    <select id="stimul1" align="center">
        <option value='red'>Red</option>
        <option value='green'>Green</option>
        <option value='yellow'>Yellow</option>
        <option value='blue'>Blue</option>
        <option value='purple'>Purple</option>
        <option value='grey'>Grey</option>
        </select>

    <select id="stimul2" align="center">
        <option value='red'>Red</option>
        <option value='green'>Green</option>
        <option value='yellow'>Yellow</option>
        <option value='blue'>Blue</option>
        <option value='purple'>Purple</option>
        <option value='grey'>Grey</option>
        </select>
    </div>
    <br>
    <button id="start" onclick="get_info()"> Let's start!</button>
</body>
</html>
