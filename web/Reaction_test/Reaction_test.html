<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <title>Reaction test</title>

        <script src="eel.js"></script>
        <link rel="icon" type="image/jpg" href="/favicon.jpg">

        <link rel="stylesheet" href="Reaction_test_2.css">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <link href="https://fonts.googleeapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">


    <script type="text/javascript" src="/eel.js"></script>
    <script type="text/javascript">
    var key_1 = 'q';
    var trigger_1 = 0;
    var key_2 = 'w';
    var trigger_2 = 0;
    var key_3 = 'e';
    var trigger_3 = 0;
    var key_4 = 'a';
    var trigger_4 = 0;
    var key_5 = 's';
    var trigger_5 = 0;
    var key_6 = 'd';
    var trigger_6 = 0;
    var timeleft = 12;
    var not_target = 0;
    var errors = 0;
    var errors2 = 0;
    var timer_1 = timeleft - 12;
    var timer_2 = timeleft - 8;
    var timer_3 = timeleft - 7;
    var timer_4 = timeleft - 5;
    var timer_5 = timeleft - 9;
    var timer_6 = timeleft - 10;
    var downloadTimer = setInterval(async function(){
            if(timeleft <= 0){
                clearInterval(downloadTimer);
                finish();
            }
                timeleft -= 1;
              if (timeleft == timer_1){
                eel.start_timer()();
                $("#stimul_1").css('background', 'red');
                trigger_1 = 1;
                if (key_1 == 'not'){
                    not_target = 1;
                }
              }
              if (timeleft == timer_2){
                eel.start_timer()();
                $("#stimul_2").css('background', 'green');
                trigger_2 = 1;
                if (key_2 == 'not'){
                    not_target = 1;
                }
              }
              if (timeleft == timer_3){
                eel.start_timer()();
                $("#stimul_3").css('background', 'yellow');
                trigger_3 = 1;
                if (key_3 == 'not'){
                    not_target = 1;
                }
              }
              if (timeleft == timer_4){
                eel.start_timer()();
                $("#stimul_4").css('background', 'blue');
                trigger_4 = 1;
                if (key_4 == 'not'){
                    not_target = 1;
                }
              }
              if (timeleft == timer_5){
                eel.start_timer()();
                $("#stimul_5").css('background', 'purple');
                trigger_5 = 1;
                if (key_5 == 'not'){
                    not_target = 1;
                }
              }
              if (timeleft == timer_6){
                eel.start_timer()();
                $("#stimul_6").css('background', 'grey');
                trigger_6 = 1;
                if (key_6 == 'not'){
                    not_target = 1;
                }
              }
              if (timeleft == timer_1 - 3 && key_1 == 'not'){
                $("#stimul_1").css('background', '#333333');
                trigger_1 = 0;
                not_target = 0;
              }
              if (timeleft == timer_2 - 3 && key_2 == 'not'){
                $("#stimul_2").css('background', '#333333');
                trigger_2 = 0;
                not_target = 0;
              }
              if (timeleft == timer_3 - 3 && key_3 == 'not'){
                $("#stimul_3").css('background', '#333333');
                trigger_3 = 0;
                not_target = 0;
              }
              if (timeleft == timer_4 - 3 && key_4 == 'not'){
                $("#stimul_4").css('background', '#333333');
                trigger_4 = 0;
                not_target = 0;
              }
              if (timeleft == timer_5 - 3 && key_5 == 'not'){
                $("#stimul_5").css('background', '#333333');
                trigger_5 = 0;
                not_target = 0;
              }
              if (timeleft == timer_6 - 3 && key_6 == 'not'){
                $("#stimul_6").css('background', '#333333');
                trigger_6 = 0;
                not_target = 0;
              }
            }, 1000);



        document.addEventListener("keydown", async function (event) {
            if (trigger_1 == 1 && event.key == key_1){
                let reaction = await eel.finish_timer()();
                document.getElementById("reaction").innerHTML = 'Last reaction time : ' + reaction;
                $("#stimul_1").css('background', '#333333');
                trigger_1 = 0;
            }else{
            if (trigger_2 == 1 && event.key == key_2){
                let reaction = await eel.finish_timer()();
                document.getElementById("reaction").innerHTML = 'Last reaction time : ' + reaction;
                $("#stimul_2").css('background', '#333333');
                trigger_2 = 0;
            }else{
            if (trigger_3 == 1 && event.key == key_3){
                let reaction = await eel.finish_timer()();
                document.getElementById("reaction").innerHTML = 'Last reaction time : ' + reaction;
                $("#stimul_3").css('background', '#333333');
                trigger_3 = 0;
            }else{
            if (trigger_4 == 1 && event.key == key_4){
                let reaction = await eel.finish_timer()();
                document.getElementById("reaction").innerHTML = 'Last reaction time : ' + reaction;
                $("#stimul_4").css('background', '#333333');
                trigger_4 = 0;
            }else{
            if (trigger_5 == 1 && event.key == key_5){
                let reaction = await eel.finish_timer()();
                document.getElementById("reaction").innerHTML = 'Last reaction time : ' + reaction;
                $("#stimul_5").css('background', '#333333');
                trigger_5 = 0;
            }else{
            if (trigger_6 == 1 && event.key == key_6){
                let reaction = await eel.finish_timer()();
                document.getElementById("reaction").innerHTML = 'Last reaction time : ' + reaction;
                $("#stimul_6").css('background', '#333333');
                trigger_6 = 0;
            }else{
            if (!(event.key == key_1 && trigger_1 == 1) | !(event.key == key_2 && trigger_2 == 1) | !(event.key == key_3 && trigger_3 == 1) | !(event.key == key_4 && trigger_4 == 1) | !(event.key == key_5 && trigger_5 == 1) | !(event.key == key_6 && trigger_6 == 1)){
                if (not_target == 1){
                    errors2 += 1;
                }else{
                errors += 1;}
                document.getElementById("reaction").innerHTML = 'ERROR!';
            }}}}}}}
        });

        async function finish(){
        eel.Reaction_test_finish(errors, errors2)();
        window.location.href = 'Reaction_test_results.html';
        }


    </script>
</head>
<body align="center">
    <div id="header">
        <a href="../Cover.html" id="header_button"> Exit </a>
        <span id='header_text'> Reaction test </span>
        <span id="Space">
        </span>
    </div>
    <div class="block">
    <button id="stimul_1" class="circle"></button>
        <button id="stimul_2" class="circle"></button>
        <button id="stimul_3" class="circle"></button>
    </div>
    <div class="block">
        <button id="stimul_4" class="circle"></button>
    <button id="stimul_5" class="circle"></button>
    <button id="stimul_6" class="circle"></button>
    </div>
    <div id="reaction"> </div>
</body>
</html>
